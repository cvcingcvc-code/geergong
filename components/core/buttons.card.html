<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--surface-card)}#root{display:flex;flex-direction:column;gap:18px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel">
const { Button, IconButton } = window.GorgonDesignSystem_56aa78;
function Demo(){
  return (
    <>
      <div className="row">
        <Button variant="primary">去发现</Button>
        <Button variant="secondary">查看详情</Button>
        <Button variant="ghost">取消</Button>
        <Button variant="mint" leadingIcon={<i data-lucide="check" style={{width:16,height:16}}/>}>已同步</Button>
        <Button variant="inverse">登录</Button>
      </div>
      <div className="row">
        <Button size="sm">Small</Button>
        <Button size="md">Medium</Button>
        <Button size="lg">Large</Button>
        <Button disabled>不可用</Button>
      </div>
      <div className="row">
        <IconButton label="搜索" variant="soft"><i data-lucide="search" style={{width:18,height:18}}/></IconButton>
        <IconButton label="收藏" variant="soft" active><i data-lucide="heart" style={{width:18,height:18}}/></IconButton>
        <IconButton label="分享" variant="outline"><i data-lucide="share-2" style={{width:18,height:18}}/></IconButton>
        <IconButton label="添加" variant="solid"><i data-lucide="plus" style={{width:18,height:18}}/></IconButton>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),60);
</script>
</body>
</html>
