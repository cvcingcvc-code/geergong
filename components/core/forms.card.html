<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--surface-card)}#root{display:flex;flex-direction:column;gap:16px;max-width:560px}.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel">
const { SearchField, Input, Switch, SegmentedControl } = window.GorgonDesignSystem_56aa78;
function Demo(){
  const [tab,setTab] = React.useState("本周末");
  const [on,setOn] = React.useState(true);
  return (
    <>
      <SearchField placeholder="搜索活动、地点、标签"/>
      <div className="row">
        <Input label="昵称" placeholder="你的名字" leadingIcon={<i data-lucide="user" style={{width:18,height:18}}/>}/>
        <Input label="邮箱" defaultValue="bad@" invalid hint="邮箱格式不正确"/>
      </div>
      <div className="row" style={{justifyContent:'space-between'}}>
        <SegmentedControl options={["本周末","下周末","全部"]} value={tab} onChange={setTab}/>
        <label style={{display:'flex',alignItems:'center',gap:10,fontSize:'var(--text-sm)',color:'var(--text-body)'}}>
          仅看免费 <Switch checked={on} onChange={setOn}/>
        </label>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),60);
</script>
</body>
</html>
