<!-- @dsCard group="App" viewport="560x900" name="Gorgon Mobile App" subtitle="Interactive — discover, sync, my weekend, map" -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorgon · 发现你的周末</title>
<link rel="stylesheet" href="../../styles.css">
<!-- PHASE 4.1 — responsive layout layer (breakpoints + shell geometry).
     Loaded after the design system so it can consume its tokens. -->
<link rel="stylesheet" href="responsive.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<!-- Demo MVP extensions (additive; do not modify the recovered design system) -->
<script src="categories-ext.js"></script>
<style>
  @keyframes gg-toast-in{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes gg-detail-in{from{transform:translateX(100%)}to{transform:translateX(0)}}
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="24" fill="#5B47E0"/>
    <path d="M62 38 A14 14 0 1 0 66 52 L52 52" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="70" cy="32" r="8" fill="#00C28E"/>
  </svg>
</template>
<div id="root"></div>
<script src="generated-data.js"></script>
<script src="generated-search-demo.js"></script>
<script src="data.js"></script>
<script src="data-adapter.js"></script>
<script src="store.js"></script>
<script src="demo-reset.js"></script>
<!-- Unified responsive primitives: useResponsive() / currentBreakpoint() -->
<script src="responsive.js"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="DiscoverScreen.jsx"></script>
<script type="text/babel" src="ActivityDetailScreen.jsx"></script>
<script type="text/babel" src="SearchScreen.jsx"></script>
<script type="text/babel" src="NaturalSearchScreen.jsx"></script>
<script type="text/babel" src="MyWeekendScreen.jsx"></script>
<script type="text/babel" src="MapScreen.jsx"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel" data-presets="react">
const { StatusBar, TabBar, PhoneFrame, AppShell, DiscoverScreen, ActivityDetailScreen, SearchScreen, NaturalSearchScreen, MyWeekendScreen, MapScreen } = window.GorgonApp;
const { useResponsive } = window.GorgonResponsive;

function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div style={{ position: "absolute", top: "var(--gg-toast-top)", left: "50%", transform: "translateX(-50%)", zIndex: 50,
      background: "var(--ink)", color: "#fff", padding: "11px 18px", borderRadius: "var(--radius-pill)",
      display: "flex", alignItems: "center", gap: 9, boxShadow: "var(--shadow-lg)", animation: "gg-toast-in var(--dur-base) var(--ease-out)", whiteSpace: "nowrap" }}>
      <span style={{ width: 22, height: 22, borderRadius: "50%", background: "var(--accent)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
        <i data-lucide="check" style={{ width: 14, height: 14, color: "#06241B" }} />
      </span>
      <span style={{ fontSize: 13.5, fontWeight: 600 }}>{msg}</span>
    </div>
  );
}

const ALL_IDS = new Set((window.GORGON_DATA.activities || []).map((a) => a.id));
const idsToMap = (ids) => { const m = {}; (ids || []).forEach((id) => { m[id] = true; }); return m; };

function App() {
  const [tab, setTab] = React.useState("discover");
  const [synced, setSynced] = React.useState(() => idsToMap(window.GorgonStore.getWeekend()));
  const [favorites, setFavorites] = React.useState(() => window.GorgonStore.getFavorites());
  const [detail, setDetail] = React.useState(null);
  const [mapFocus, setMapFocus] = React.useState(null);
  const [toast, setToast] = React.useState("");
  const toastTimer = React.useRef(null);

  // Single source of truth for the shell decision. Everything else about
  // the layout is handled by CSS media queries (responsive.css).
  const { isMobile } = useResponsive();

  const flash = (m) => {
    setToast(m); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 1800);
  };

  // --- My Weekend (persisted) ---
  const toggleSync = (id) => {
    const on = !synced[id];
    const next = { ...synced, [id]: on };
    setSynced(next);
    window.GorgonStore.setWeekend(Object.keys(next).filter((k) => next[k]));
    flash(on ? "已加入我的周末" : "已从我的周末移除");
  };

  // --- Favorites (persisted) ---
  const toggleFavorite = (id) => {
    const has = favorites.indexOf(id) >= 0;
    const next = has ? favorites.filter((x) => x !== id) : favorites.concat([id]);
    setFavorites(next);
    window.GorgonStore.setFavorites(next);
    flash(has ? "已取消收藏" : "已收藏");
    if (detail && has) setDetail(null);
  };

  const openDetail = (a) => setDetail(a);
  const showOnMap = (a) => { setMapFocus(a.id); setDetail(null); setTab("map"); };
  const changeTab = (t) => { setDetail(null); setTab(t); };

  const syncedCount = Object.keys(synced).filter((k) => synced[k] && ALL_IDS.has(k)).length;

  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  // One business tree, two chrome treatments.
  const content = (
    <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", overflow: "hidden", position: "relative" }}>
      {tab === "discover" && <DiscoverScreen synced={synced} onSync={toggleSync} onOpen={openDetail} onGoSearch={() => setTab("search")} onGoSmart={() => setTab("smart")} />}
      {tab === "smart" && <NaturalSearchScreen />}
      {tab === "search" && <SearchScreen synced={synced} onSync={toggleSync} onOpen={openDetail} />}
      {tab === "weekend" && <MyWeekendScreen synced={synced} onSync={toggleSync} onOpen={openDetail} onDiscover={() => setTab("discover")} favorites={favorites} onToggleFavorite={toggleFavorite} />}
      {tab === "map" && <MapScreen synced={synced} onSync={toggleSync} onOpen={openDetail} focusId={mapFocus} />}

      {detail && (
        <div className="gg-detail-overlay" style={{ animation: "gg-detail-in var(--dur-slow) var(--ease-out)" }}>
          <ActivityDetailScreen activity={detail} synced={!!synced[detail.id]} onSync={() => toggleSync(detail.id)}
            onBack={() => setDetail(null)} favorited={favorites.indexOf(detail.id) >= 0}
            onToggleFavorite={() => toggleFavorite(detail.id)} onShowMap={() => showOnMap(detail)} />
        </div>
      )}
      <Toast msg={toast} />
    </div>
  );

  if (isMobile) {
    // Unchanged mobile presentation: phone mock-up + bottom navigation.
    return (
      <PhoneFrame>
        <StatusBar dark={false} />
        {content}
        <TabBar active={tab} onChange={changeTab} syncedCount={syncedCount} />
      </PhoneFrame>
    );
  }

  // Tablet & desktop: full-bleed surface, top header + left sidebar.
  // The bottom TabBar and the phone chassis are intentionally NOT rendered.
  return (
    <AppShell tab={tab} onTab={changeTab} syncedCount={syncedCount}
      onSettings={() => flash("设置（演示版暂未开放）")}>
      {content}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
setTimeout(() => window.lucide && window.lucide.createIcons(), 120);
</script>
</body>
</html>
