<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorgon · 发现你的周末</title>
<link rel="stylesheet" href="../../styles.css">
<!-- PHASE 4.1 — responsive layout layer (breakpoints + shell geometry).
     Loaded after the design system so it can consume its tokens. -->
<link rel="stylesheet" href="responsive.css">
<!-- PHASE 8.1 — runtime vendored into assets/vendor/.
     These used to load from unpkg.com. The public build cannot depend on a
     third-party CDN: unpkg is frequently unreachable from mainland China, and
     when it fails the whole app is a blank page. The files are byte-identical
     to what unpkg served (the integrity hashes below are the originals, so a
     tampered copy is refused by the browser instead of silently running). -->
<script src="../../assets/vendor/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script src="../../assets/vendor/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script src="../../assets/vendor/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>
<script src="../../_ds_bundle.js"></script>
<!-- Demo MVP extensions (additive; do not modify the recovered design system) -->
<script src="categories-ext.js"></script>
<style>
  @keyframes gg-toast-in{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes gg-detail-in{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="24" fill="#5B47E0"/>
    <path d="M62 38 A14 14 0 1 0 66 52 L52 52" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="70" cy="32" r="8" fill="#00C28E"/>
  </svg>
</template>
<div id="root"></div>
<script src="generated-data.js"></script>
<script src="generated-search-demo.js"></script>
<script src="data.js"></script>
<script src="data-adapter.js"></script>
<!-- PHASE 5.1: the ONE Shanghai district vocabulary/normaliser the whole app
     filters on (mirrors pipeline/normalize/location.py). Must load before
     store.js (which sanitises against it) and before activity-view.js. -->
<script src="district.js"></script>
<script src="store.js"></script>
<script src="demo-reset.js"></script>
<!-- Unified responsive primitives: useResponsive() / currentBreakpoint() -->
<script src="responsive.js"></script>
<!-- PHASE 5: one activity view model for every surface (plain JS, no JSX) -->
<script src="activity-view.js"></script>
<!-- PHASE 5: shared atoms — image w/ fallback, trust chip, provider badge -->
<script type="text/babel" src="common.jsx"></script>
<!-- PHASE 5.1: the shared district picker (Discover / Search / Map / 智能) -->
<script type="text/babel" src="district-picker.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="DiscoverScreen.jsx"></script>
<script type="text/babel" src="ActivityDetailScreen.jsx"></script>
<script type="text/babel" src="SearchScreen.jsx"></script>
<script type="text/babel" src="NaturalSearchScreen.jsx"></script>
<script type="text/babel" src="MyWeekendScreen.jsx"></script>
<script type="text/babel" src="MapScreen.jsx"></script>
<script src="../../assets/vendor/lucide.min.js"></script>
<script type="text/babel" data-presets="react">
const { StatusBar, TabBar, PhoneFrame, AppShell, DiscoverScreen, ActivityDetailScreen, SearchScreen, NaturalSearchScreen, MyWeekendScreen, MapScreen, DistrictPicker } = window.GorgonApp;
const { useResponsive } = window.GorgonResponsive;
const ActivityView = window.GorgonActivityView;
const District = window.GorgonDistrict;

function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div style={{ position: "absolute", top: "var(--gg-toast-top)", left: "50%", transform: "translateX(-50%)", zIndex: 50,
      background: "var(--ink)", color: "#fff", padding: "11px 18px", borderRadius: "var(--radius-pill)",
      display: "flex", alignItems: "center", gap: 9, boxShadow: "var(--shadow-lg)", animation: "gg-toast-in var(--dur-base) var(--ease-out)", whiteSpace: "nowrap" }}>
      <span style={{ width: 22, height: 22, borderRadius: "50%", background: "var(--accent)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
        <i data-lucide="check" style={{ width: 14, height: 14, color: "#06241B" }} />
      </span>
      <span style={{ fontSize: 13.5, fontWeight: 600 }}>{msg}</span>
    </div>
  );
}

const ALL_ACTIVITIES = (window.GORGON_DATA.activities || []);

/** Anything (raw record, id, or an already-normalised view) -> view model. */
function asView(x) {
  if (!x) return null;
  if (typeof x === "string") {
    const found = ALL_ACTIVITIES.find((a) => a.id === x);
    return found ? ActivityView.toView(found) : null;
  }
  if (x.__view) return x;
  return ActivityView.toView(x);
}

function App() {
  const [tab, setTab] = React.useState("discover");
  // My Weekend persists FULL snapshots (id -> view), so a saved search result
  // survives a refresh even when the search session is gone.
  const [weekend, setWeekend] = React.useState(() => window.GorgonStore.getWeekendItems());
  const [favorites, setFavorites] = React.useState(() => window.GorgonStore.getFavorites());
  const [detail, setDetail] = React.useState(null);
  const [mapFocus, setMapFocus] = React.useState(null);
  // ONE district selection for the whole app (Discover / Search / Map / 智能),
  // restored from localStorage so a refresh keeps the user's choice.
  const [district, setDistrictState] = React.useState(() => window.GorgonStore.getDistrict());
  const [toast, setToast] = React.useState("");
  const toastTimer = React.useRef(null);

  const { isMobile } = useResponsive();

  const setDistrict = (d) => {
    setDistrictState(window.GorgonStore.setDistrict(d));
  };

  const flash = (m) => {
    setToast(m); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 1800);
  };

  // --- My Weekend (persisted, snapshot-carrying) ---
  const toggleSync = (input) => {
    const view = asView(input);
    if (!view || !view.id) return;
    const on = !weekend[view.id];
    const next = Object.assign({}, weekend);
    if (on) next[view.id] = view; else delete next[view.id];
    setWeekend(next);
    window.GorgonStore.setWeekendItems(next);
    flash(on ? "已加入我的周末" : "已从我的周末移除");
  };

  // --- Favorites (persisted) ---
  const toggleFavorite = (id) => {
    const has = favorites.indexOf(id) >= 0;
    const next = has ? favorites.filter((x) => x !== id) : favorites.concat([id]);
    setFavorites(next);
    window.GorgonStore.setFavorites(next);
    flash(has ? "已取消收藏" : "已收藏");
  };

  const openDetail = (x) => { const v = asView(x); if (v) setDetail(v); };
  const showOnMap = (v) => { setMapFocus(v.id); setDetail(null); setTab("map"); };
  const changeTab = (t) => { setDetail(null); setTab(t); };

  const syncedCount = Object.keys(weekend).length;

  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  const content = (
    <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", overflow: "hidden", position: "relative" }}>
      {tab === "discover" && <DiscoverScreen synced={weekend} onSync={toggleSync} onOpen={openDetail} onGoSearch={() => setTab("search")} onGoSmart={() => setTab("smart")} district={district} onDistrictChange={setDistrict} />}
      {tab === "smart" && <NaturalSearchScreen synced={weekend} onSync={toggleSync} onOpen={openDetail} district={district} onDistrictChange={setDistrict} />}
      {tab === "search" && <SearchScreen synced={weekend} onSync={toggleSync} onOpen={openDetail} district={district} onDistrictChange={setDistrict} />}
      {tab === "weekend" && <MyWeekendScreen weekend={weekend} onSync={toggleSync} onOpen={openDetail} onDiscover={() => setTab("discover")} favorites={favorites} onToggleFavorite={toggleFavorite} />}
      {tab === "map" && <MapScreen synced={weekend} onSync={toggleSync} onOpen={openDetail} focusId={mapFocus} district={district} onDistrictChange={setDistrict} />}

      {detail && (
        <div className="gg-detail-overlay" style={{ animation: "gg-detail-in var(--dur-base) var(--ease-out)" }}>
          <ActivityDetailScreen view={detail} synced={!!weekend[detail.id]} onSync={() => toggleSync(detail)}
            onBack={() => setDetail(null)} onShowMap={() => showOnMap(detail)} />
        </div>
      )}
      <Toast msg={toast} />
    </div>
  );

  if (isMobile) {
    return (
      <PhoneFrame>
        <StatusBar dark={false} />
        {content}
        <TabBar active={tab} onChange={changeTab} syncedCount={syncedCount} />
      </PhoneFrame>
    );
  }

  return (
    <AppShell tab={tab} onTab={changeTab} syncedCount={syncedCount} district={district}
      onSettings={() => flash("设置（演示版暂未开放）")}>
      {content}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
setTimeout(() => window.lucide && window.lucide.createIcons(), 120);
</script>
</body>
</html>
