<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--grad-brand);color:#fff;font-family:var(--font-sans);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px}
  .glow{position:absolute;border-radius:50%}
  h1{font-family:var(--font-display);font-size:88px;font-weight:700;letter-spacing:-0.02em;margin:28px 0 0;z-index:2;color:#fff}
  .accent{color:#4FE0BA}
  .sub{font-size:24px;color:#E4E0FB;margin-top:22px;z-index:2;max-width:620px;line-height:1.5}
  .cta{display:inline-flex;align-items:center;gap:10px;margin-top:42px;background:#fff;color:var(--brand-strong);font-weight:700;font-size:19px;padding:18px 34px;border-radius:999px;box-shadow:var(--shadow-lg);z-index:2}
  .foot{position:absolute;bottom:48px;display:flex;gap:34px;color:#C9C1F7;font-size:15px;z-index:2}
  .foot b{color:#fff}
</style></head>
<body><div class="slide">
  <div class="glow" style="width:560px;height:560px;background:radial-gradient(circle,#00C28E44,transparent 70%);top:-180px;left:-120px"></div>
  <div class="glow" style="width:480px;height:480px;background:radial-gradient(circle,#ffffff33,transparent 70%);bottom:-200px;right:-120px"></div>

  <h1>这个周末，<span class="accent">同步</span>起来</h1>
  <p class="sub">和我们一起，把上海大学生的周末变得更值得期待。</p>
  <span class="cta">扫码体验 Gorgon <span style="font-size:22px">→</span></span>

  <div class="foot"><span>📧 <b>hello@gorgon.app</b></span><span>🏫 <b>上海戈尔贡科技有限公司</b></span><span>🌐 <b>gorgon.app</b></span></div>
</div></body></html>
