<!-- @dsCard group="Slides" viewport="1280x720" name="Quote slide" subtitle="Large pull-quote with attribution" -->
<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--surface-card);font-family:var(--font-sans);padding:84px 96px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--grad-sync)}
  .mark{font-family:var(--font-display);font-size:160px;font-weight:700;color:var(--indigo-100);line-height:.6;height:80px}
  blockquote{margin:0;font-family:var(--font-display);font-size:54px;font-weight:600;line-height:1.28;color:var(--text-strong);letter-spacing:-0.01em;max-width:940px}
  blockquote .hl{color:var(--brand);background:linear-gradient(transparent 62%, var(--mint-200) 0);padding:0 2px}
  .by{display:flex;align-items:center;gap:16px;margin-top:48px}
  .av{width:56px;height:56px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px}
  .nm{font-size:19px;font-weight:700;color:var(--text-strong)}
  .rl{font-size:15px;color:var(--text-muted);margin-top:3px}
</style></head>
<body><div class="slide">
  <div class="bar"></div>
  <div class="mark">“</div>
  <blockquote>周末不该浪费在<span class="hl">找活动</span>上。Gorgon 让我打开就知道这周有什么、就在<span class="hl">我附近</span>，喜欢的直接同步。</blockquote>
  <div class="by">
    <span class="av">林</span>
    <div><div class="nm">林同学 · 大三</div><div class="rl">同济大学 · Gorgon 早期用户</div></div>
  </div>
</div></body></html>
