<!-- @dsCard group="Slides" viewport="1280x720" name="Agenda slide" subtitle="Numbered section list on light surface" -->
<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--bg-base);font-family:var(--font-sans);padding:72px 80px;box-sizing:border-box;display:flex;flex-direction:column}
  .kicker{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.16em;font-size:14px;font-weight:600;color:var(--brand)}
  h1{font-family:var(--font-display);font-size:52px;font-weight:700;color:var(--text-strong);margin:10px 0 44px;letter-spacing:-0.01em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 56px;flex:1}
  .row{display:flex;gap:22px;align-items:flex-start;padding:22px 0;border-top:1px solid var(--border-default)}
  .num{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--brand);width:54px;flex:none;font-variant-numeric:tabular-nums}
  .rt{font-size:23px;font-weight:700;color:var(--text-strong)}
  .rd{font-size:16px;color:var(--text-muted);margin-top:6px;line-height:1.5}
</style></head>
<body><div class="slide">
  <div class="kicker">Agenda · 目录</div>
  <h1>今天我们聊什么</h1>
  <div class="grid">
    <div class="row"><div class="num">01</div><div><div class="rt">问题</div><div class="rd">周末活动信息散落各处，学生找得累、错过得多。</div></div></div>
    <div class="row"><div class="num">02</div><div><div class="rt">产品</div><div class="rd">发现 + 同步：一处检索，一键加入我的周末。</div></div></div>
    <div class="row"><div class="num">03</div><div><div class="rt">体验</div><div class="rd">发现流、活动详情、我的周末、地图四大场景。</div></div></div>
    <div class="row"><div class="num">04</div><div><div class="rt">市场</div><div class="rd">上海 60+ 高校，12 万在校大学生的周末时间。</div></div></div>
    <div class="row"><div class="num">05</div><div><div class="rt">数据</div><div class="rd">活动覆盖、同步率与留存的早期信号。</div></div></div>
    <div class="row"><div class="num">06</div><div><div class="rt">下一步</div><div class="rd">校园合作、主办方生态与商业化路径。</div></div></div>
  </div>
</div></body></html>
