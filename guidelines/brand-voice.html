<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-card);font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border-radius:var(--radius-md);padding:14px 16px}
.do{background:var(--accent-soft)}.dont{background:var(--danger-soft)}
.h{font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:8px}
.do .h{color:var(--accent-strong)}.dont .h{color:#C42B30}
.line{font-size:14px;color:var(--text-body);line-height:1.7}
.line b{color:var(--text-strong);font-weight:600}</style></head>
<body><div class="grid">
<div class="box do"><div class="h">✓ Gorgon 这样说</div>
<div class="line"><b>周六下午有空吗？</b><br>就在你附近 · 38 场活动<br>立即同步 · 已同步 ✓<br><b>去发现</b></div></div>
<div class="box dont"><div class="h">✕ 不这样说</div>
<div class="line">欢迎使用本平台<br>点击此处查看更多详情<br>您有 38 个可参与的活动项目<br>提交</div></div>
</div>
<div style="font-size:12px;color:var(--text-muted);margin-top:12px;line-height:1.6">用 <b style="color:var(--text-strong)">你</b> 不用「您」· 短句 · 数字与时间是主角 · 英文做点缀（<span style="font-family:var(--font-display);letter-spacing:.08em">THIS WEEKEND</span>）· emoji 克制</div>
</body></html>
