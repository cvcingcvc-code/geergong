<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="From xs chips to 2xl sheets + pill & squircle" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-card);font-family:var(--font-sans)}
.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.item{text-align:center}
.box{width:72px;height:64px;background:var(--brand-soft);border:1.5px solid var(--indigo-300)}
.lbl{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:6px}</style></head>
<body><div class="row">
<div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lbl">xs·6</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm·10</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md·14</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg·20</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl·28</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="lbl">2xl·36</div></div>
<div class="item"><div class="box" style="width:64px;border-radius:var(--radius-pill)"></div><div class="lbl">pill</div></div>
</div></body></html>
