<!-- @dsCard group="Colors" viewport="700x140" name="Brand colors" subtitle="Electric indigo + mint — the two brand colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans)}
.wrap{display:flex;gap:14px}.col{flex:1}
.sw{height:64px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font-family:var(--font-display);font-size:12px;font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:7px;font-size:11px;white-space:nowrap}
.name{font-weight:700;color:var(--text-strong)}.hex{color:var(--text-muted);font-family:var(--font-mono)}
.scale{display:flex;gap:4px;margin-top:10px}.scale span{flex:1;height:20px;border-radius:5px}</style></head>
<body><div class="wrap">
<div class="col">
  <div class="sw" style="background:var(--indigo-500)">Primary</div>
  <div class="meta"><span class="name">Electric Indigo</span><span class="hex">#5B47E0</span></div>
  <div class="scale">
    <span style="background:var(--indigo-100)"></span><span style="background:var(--indigo-300)"></span>
    <span style="background:var(--indigo-500)"></span><span style="background:var(--indigo-700)"></span><span style="background:var(--indigo-900)"></span>
  </div>
</div>
<div class="col">
  <div class="sw" style="background:var(--mint-500);color:#06241B">Secondary</div>
  <div class="meta"><span class="name">Mint · 已同步</span><span class="hex">#00C28E</span></div>
  <div class="scale">
    <span style="background:var(--mint-100)"></span><span style="background:var(--mint-300)"></span>
    <span style="background:var(--mint-500)"></span><span style="background:var(--mint-600)"></span><span style="background:var(--mint-700)"></span>
  </div>
</div>
</div></body></html>
