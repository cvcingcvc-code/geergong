<!-- @dsCard group="Colors" viewport="700x130" name="Semantic & category" subtitle="Status colors and the six activity-category hues" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans)}
.grp{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.section{display:flex;flex-direction:column;gap:8px}
.h{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);font-family:var(--font-display);font-weight:600}
.row{display:flex;gap:12px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-body);font-weight:500}
.dot{width:16px;height:16px;border-radius:50%}</style></head>
<body>
<div class="grp">
  <div class="section">
    <div class="h">Semantic</div>
    <div class="row">
      <span class="chip"><span class="dot" style="background:var(--success)"></span>成功</span>
      <span class="chip"><span class="dot" style="background:var(--warning)"></span>提醒</span>
      <span class="chip"><span class="dot" style="background:var(--danger)"></span>错误</span>
      <span class="chip"><span class="dot" style="background:var(--info)"></span>信息</span>
    </div>
  </div>
  <div class="section">
    <div class="h">Category 活动分类</div>
    <div class="row">
      <span class="chip"><span class="dot" style="background:var(--cat-sport)"></span>运动</span>
      <span class="chip"><span class="dot" style="background:var(--cat-music)"></span>音乐</span>
      <span class="chip"><span class="dot" style="background:var(--cat-art)"></span>艺术</span>
      <span class="chip"><span class="dot" style="background:var(--cat-food)"></span>美食</span>
      <span class="chip"><span class="dot" style="background:var(--cat-outdoor)"></span>户外</span>
      <span class="chip"><span class="dot" style="background:var(--cat-study)"></span>学习</span>
    </div>
  </div>
</div></body></html>
