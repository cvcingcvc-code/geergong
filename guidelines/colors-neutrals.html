<!-- @dsCard group="Colors" viewport="700x130" name="Slate neutrals" subtitle="Cool neutral scale — backgrounds, text, borders" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans)}
.scale{display:flex;gap:6px}.item{flex:1;text-align:center}
.sw{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
.lbl{font-size:10px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono)}</style></head>
<body><div class="scale">
<div class="item"><div class="sw" style="background:var(--slate-0)"></div><div class="lbl">0</div></div>
<div class="item"><div class="sw" style="background:var(--slate-50)"></div><div class="lbl">50</div></div>
<div class="item"><div class="sw" style="background:var(--slate-100)"></div><div class="lbl">100</div></div>
<div class="item"><div class="sw" style="background:var(--slate-200)"></div><div class="lbl">200</div></div>
<div class="item"><div class="sw" style="background:var(--slate-300)"></div><div class="lbl">300</div></div>
<div class="item"><div class="sw" style="background:var(--slate-400)"></div><div class="lbl">400</div></div>
<div class="item"><div class="sw" style="background:var(--slate-500)"></div><div class="lbl">500</div></div>
<div class="item"><div class="sw" style="background:var(--slate-600)"></div><div class="lbl">600</div></div>
<div class="item"><div class="sw" style="background:var(--slate-700)"></div><div class="lbl">700</div></div>
<div class="item"><div class="sw" style="background:var(--slate-800)"></div><div class="lbl">800</div></div>
<div class="item"><div class="sw" style="background:var(--slate-900)"></div><div class="lbl">900</div></div>
<div class="item"><div class="sw" style="background:var(--ink)"></div><div class="lbl">ink</div></div>
</div></body></html>
