<!-- @dsCard group="Type" viewport="700x130" name="Kicker & bilingual accent" subtitle="Uppercase English kicker over Chinese headline" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-card)}
.kicker{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--brand)}
.head{font-family:var(--font-sans);font-size:30px;font-weight:800;color:var(--text-strong);margin-top:6px;letter-spacing:-0.01em}
.tag{display:inline-flex;gap:8px;margin-top:14px}
.t{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);background:var(--bg-sunken);padding:6px 11px;border-radius:var(--radius-pill)}</style></head>
<body>
<div class="kicker">This Weekend · 本周末</div>
<div class="head">就在你附近的 38 场活动</div>
<div class="tag"><span class="t">Free Entry</span><span class="t">42 Activities</span><span class="t">Near You</span></div>
</body></html>
