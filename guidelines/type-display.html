<!-- @dsCard group="Type" viewport="700x180" name="Display — Space Grotesk" subtitle="Headlines, big numerals, times & prices" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-card)}
.disp{font-family:var(--font-display);color:var(--text-strong);letter-spacing:var(--tracking-tight);line-height:1.05}
.big{font-size:54px;font-weight:700}.num{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:24px;margin-top:14px;color:var(--brand)}
.lbl{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);margin-top:4px}</style></head>
<body>
<div class="disp big">发现你的周末</div>
<div class="num">
  <span>38<span style="font-size:18px;color:var(--text-muted)">场</span></span>
  <span>14:30</span>
  <span>¥0</span>
  <span>2.1km</span>
</div>
<div class="lbl">Space Grotesk · 700 / 600 · tabular-nums · letter-spacing -0.015em</div>
</body></html>
